<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Diario alimentare</title>
  <style>
    body{font-family:sans-serif;max-width:480px;margin:40px auto}
    textarea{width:100%;height:80px}
    button{margin-top:8px;padding:8px 16px}
    #entry{display:none}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2 id="title">Accedi</h2>
<input id="email" type="email" placeholder="la tua email">
<button id="send">Invia link magico</button>

<div id="entry">
  <h2>Nuovo pasto</h2>
  <textarea id="text"></textarea><br>
  Sintomo (0‑10): <input id="symptom" type="number" min="0" max="10" value="0"><br>
  <button id="save">Salva</button>
  <p id="msg"></p>
</div>

<script>
/* === CONFIG === */
const SUPABASE_URL  = "https://vudebxhcimscxgvtzdbh.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1ZGVieGhjaW1zY3hndnR6ZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYxOTczNjcsImV4cCI6MjA2MTc3MzM2N30.RvMIOdZuiK0RHIOYpNUwvR-QmGkduTK01Q-IuHLCMag";
/* ============== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// 1. se arrivo col ?code=... faccio exchange
(async ()=> {
  const url = new URL(window.location.href);
  if (url.searchParams.get('code')) {
    const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
    if (!error) showForm();      // login OK
    url.search = "";             // pulisco la barra indirizzi
    history.replaceState({}, "", url);
  } else {
    // già loggato?
    const { data: { session } } = await sb.auth.getSession();
    if (session) showForm();
  }
})();

// 2. invio magic‑link
document.getElementById('send').onclick = async ()=>{
  const email = document.getElementById('email').value.trim();
  if(!email) return alert("Inserisci l'email");
  const redirect = window.location.origin;           // <<—
  const { error } = await sb.auth.signInWithOtp({
      email,
      options:{ emailRedirectTo: redirect }
  });
  alert(error ? error.message : "Controlla la posta e clicca il link");
};

// 3. salva record
document.getElementById('save').onclick = async ()=>{
  const text = document.getElementById('text').value.trim();
  const sym  = parseInt(document.getElementById('symptom').value,10);
  if(!text) return alert("Scrivi il pasto");
  const { data:{user} } = await sb.auth.getUser();
  const { error } = await sb.from('diary_entries').insert({
      user_id:user.id, raw_text:text, symptom:sym
  });
  document.getElementById('msg').textContent = error?error.message:"Salvato!";
};

function showForm(){
  document.getElementById('title').innerText="Benvenuto!";
  document.getElementById('entry').style.display="block";
  document.getElementById('send').style.display="none";
  document.getElementById('email').style.display="none";
}
</script>
</body>
</html>
